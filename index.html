<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163c3b">
  <title>GenTV · 交互鱼池</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="pond" aria-label="锦鲤鱼池。点击水面投食，或使用方向键移动光标，按确认键投食。" tabindex="0"></canvas>
  <header class="masthead"><div class="brand">GenTV<span>A MOMENT OF STILLNESS</span></div><div class="clock"><time id="time">18:54</time><span id="date"></span></div></header>
  <aside class="caption"><span class="eyebrow">水有声 · 心无事</span><h1>闲看鱼游。</h1><p>轻点水面，等一场相逢。</p></aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer><div class="instructions"><span class="live-dot"></span><span id="fish-count">20 尾锦鲤，自在游弋</span><span class="divider"></span><span class="desktop-hint">点击投食 · 长按泛起涟漪</span></div><nav aria-label="鱼池控制"><button id="ripple" title="泛起水波（R）" aria-label="泛起水波"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="9" ry="4"/><ellipse cx="12" cy="16" rx="4" ry="1.5"/><path d="M12 3v8m-3-3 3 3 3-3"/></svg></button><button id="feed" title="投食（确认键）" aria-label="投食"><svg viewBox="0 0 24 24"><path d="m7 4 3 3-4 4-3-3zM16 6l3 3m-8 4 2 2m4-1 2 2m-5 3 1 1M5 17l1 1"/></svg></button><button id="settings-toggle" title="鱼池设置" aria-label="鱼池设置" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button><button id="fullscreen" title="全屏（F）" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></nav></footer>
  <section id="settings" class="panel" aria-label="鱼池设置" hidden><div class="panel-title">池间小调<button id="close-settings" aria-label="关闭设置">×</button></div><label>锦鲤数量 <output id="count-output">20</output><input id="count" type="range" min="5" max="40" value="20"></label><label>游动节奏 <output id="speed-output">悠然</output><input id="speed" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><label class="check">显示时钟与文字<input type="checkbox" id="show-ui" checked></label><p>方向键移动光标，确认键投食<br>R 水波 · H 隐藏界面 · F 全屏</p></section>
  <script type="module" src="pond.js"></script>
</body>
</html>
